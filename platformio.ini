; PlatformIO Project Configuration File

[platformio]
default_envs = lolin32_car

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; ========================================================
; Receiver: WEMOS LOLIN32 mounted on the RC Car
; Controls TB6612FNG motor driver & receives commands via ESP-NOW
; ========================================================
[env:lolin32_car]
board = lolin32
build_src_filter = +<receiver_car.cpp>

; ========================================================
; Transmitter: ESP32 WROOM DevKit plugged into the PC (USB)
; Reads Serial commands from Python control.py & forwards via ESP-NOW
; ========================================================
[env:wroom_transmitter]
board = esp32doit-devkit-v1
build_src_filter = +<transmitter_dongle.cpp>
