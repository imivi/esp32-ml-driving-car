name: Deploy Presentation to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Build presentation HTML & PDF
        run: |
          mkdir -p _site
          # Compile presentation with HTML support enabled
          marp --html docs/presentation.md -o _site/index.html
          marp --html docs/presentation.md -o _site/presentation.html

      - name: Copy media assets
        run: |
          # Copy all media assets required by presentation (images, diagrams, video, 3D player HTML)
          cp docs/*.jpg docs/*.png docs/*.svg docs/*.pdf docs/*.mp4 docs/radar_3d.html _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

